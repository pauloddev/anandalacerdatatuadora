<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ananda Lacerda | Tatuagem Colorida | Catalão-GO</title>
<meta name="description" content="Tatuadora no estúdio Amorim Tattoo. Especialista em tatuagem colorida e fine line. Catalão-GO.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Ananda Lacerda | Tatuagem Colorida | Catalão-GO">
<meta property="og:description" content="Tatuadora no estúdio Amorim Tattoo · Colorido · Fine Line. Peça seu orçamento.">
<meta property="og:image" content="https://raw.githubusercontent.com/pauloddev/anandalacerdatatuadora/main/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raw.githubusercontent.com/pauloddev/anandalacerdatatuadora/main/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#e10600;--red-d:#9c0000;--red-l:#ff2a1f;--mut:#b8b8b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{min-height:100vh;font-family:'Poppins',sans-serif;color:#f4f4f4;display:flex;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 35% at 50% 100%,rgba(225,6,0,.16),rgba(225,6,0,0) 70%),#000}
.wrap{width:100%;max-width:460px;padding:0 0 max(30px,env(safe-area-inset-bottom))}
.top{display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 18px 16px;text-align:center}
.top img{width:min(300px,80vw);height:auto;mix-blend-mode:screen;display:block}
.top span{margin-top:2px;font-size:12px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:var(--mut)}
.top span b{color:var(--red-l);font-weight:500}
.hero{position:relative;margin:0 18px;border-radius:24px;overflow:hidden;border:2px solid var(--red);box-shadow:0 18px 40px rgba(225,6,0,.28)}
.hero img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:48%;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0))}
.hero .cap{position:absolute;left:0;right:0;bottom:18px;z-index:2;text-align:center}
.cap h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(34px,10.5vw,46px);letter-spacing:3px;text-transform:uppercase;line-height:1.05}
.cap p{margin-top:6px;font-size:12px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--red-l)}
.pad{padding:0 18px}
.tagline{margin-top:18px;text-align:center;font-size:14.5px;font-weight:300;line-height:1.7;color:var(--mut)}
.tagline b{color:#fff;font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2.5px;text-transform:uppercase;transition:transform .3s,background .3s,color .3s}
.btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{color:#fff;background:linear-gradient(135deg,var(--red-d),var(--red) 50%,var(--red-l));box-shadow:0 12px 26px rgba(225,6,0,.35),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.wht{color:#000;background:#fff}
.label{margin:38px 0 16px;display:flex;align-items:center;gap:14px;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:5px;text-transform:uppercase}
.label::before,.label::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
.label::after{transform:scaleX(-1)}
.carousel{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border-radius:18px;border:2px solid var(--red);box-shadow:0 18px 40px rgba(225,6,0,.25);scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0;background:#0a0a0a}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:9/16;background:#0a0a0a}
.slide video,.slide img{display:block;width:100%;height:100%;object-fit:cover}
.arrow{width:40px;height:40px;border-radius:50%;border:2px solid var(--red);cursor:pointer;background:#000;display:grid;place-items:center;transition:background .3s,transform .3s}
.arrow svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arrow:active{transform:scale(.92)}
.dots{margin-top:16px;display:flex;justify-content:center;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.25);cursor:pointer;transition:all .3s}
.dots button.on{background:var(--red);width:24px;border-radius:99px}
.photo2{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:22px;border:2px solid var(--red);box-shadow:0 14px 30px rgba(225,6,0,.22)}
.foot{margin-top:28px;text-align:center;font-size:12px;letter-spacing:1.5px;color:#777;font-weight:300}
@media (hover:hover){.btn:hover{transform:translateY(-3px)}.btn.wht:hover{background:var(--red);color:#fff}.arrow:hover{background:var(--red)}}
a:focus-visible,button:focus-visible{outline:3px solid var(--red-l);outline-offset:3px}
</style>
</head>
<body>
<div class="bg"></div>
<main class="wrap">
  <div class="top"><img src="logo.png" alt="Studio Amorim Tattoo" width="900" height="900"><span>Tatuagem <b>Colorida</b> · Catalão-GO</span></div>
  <div class="hero">
    <img src="ananda1.jpg" alt="Ananda Lacerda, tatuadora" width="810" height="1012">
    <div class="cap"><h1>Ananda Lacerda</h1><p>Tatuadora · Amorim Tattoo</p></div>
  </div>
  <div class="pad">
    <p class="tagline">Tatuadora no estúdio <b>Amorim Tattoo</b><br>Especialista <b>Colorido · Fine Line</b></p>
    <div class="btns">
      <a class="btn pri" target="_blank" rel="noopener" href="https://www.instagram.com/ananda_lacerda_tatuadora"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".6" fill="currentColor"/></svg> Instagram</a>
      <a class="btn wht" target="_blank" rel="noopener" href="https://www.instagram.com/ananda_lacerda_tatuadora">Orçamento</a>
    </div>

    <p class="label">Portfólio</p>
    <div class="carousel">
      <button class="arrow" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="track" id="track">
        <div class="slide"><video src="v1.mp4" poster="v1.jpg" muted loop playsinline preload="metadata"></video></div>
        <div class="slide"><video data-src="v2.mp4" poster="v2.jpg" muted loop playsinline preload="none"></video></div>
        <div class="slide"><video data-src="v3.mp4" poster="v3.jpg" muted loop playsinline preload="none"></video></div>
        <div class="slide"><video data-src="v4.mp4" poster="v4.jpg" muted loop playsinline preload="none"></video></div>
        <div class="slide"><video data-src="v5.mp4" poster="v5.jpg" muted loop playsinline preload="none"></video></div>
        <div class="slide"><img src="v6.jpg" alt="Tatuagem colorida" width="640" height="1136" loading="lazy"></div>
      </div>
      <button class="arrow" id="next" aria-label="Próximo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="dots" id="dots"></div>

    <p class="label">Em ação</p>
    <img class="photo2" src="ananda2.jpg" alt="Ananda Lacerda tatuando" width="900" height="1125" loading="lazy">
    <p class="foot">© Ananda Lacerda · Studio Amorim Tattoo · Catalão-GO</p>
  </div>
</main>
<script>
(()=>{const t=document.getElementById('track'),s=[...t.children],d=document.getElementById('dots'),vs=s.map(x=>x.querySelector('video'));
s.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Item '+(i+1));b.onclick=()=>go(i);d.appendChild(b)});
const ds=[...d.children];let c=-1;
const go=i=>{i=(i+s.length)%s.length;t.scrollTo({left:i*t.clientWidth,behavior:'smooth'})};
const load=v=>{if(v&&v.dataset.src&&!v.src){v.preload='auto';v.src=v.dataset.src}};
const show=i=>{if(i===c)return;c=i;ds.forEach((x,k)=>x.classList.toggle('on',k===i));
 vs.forEach((v,k)=>{if(!v)return;if(k===i){load(v);const p=v.play();if(p&&p.catch)p.catch(()=>{})}else{v.pause()}});
 load(vs[(i+1)%vs.length])};
document.getElementById('prev').onclick=()=>go(c-1);document.getElementById('next').onclick=()=>go(c+1);
t.addEventListener('scroll',()=>{clearTimeout(t._s);t._s=setTimeout(()=>show(Math.round(t.scrollLeft/t.clientWidth)),80)},{passive:true});
addEventListener('resize',()=>t.scrollTo({left:Math.max(c,0)*t.clientWidth,behavior:'auto'}));
show(0)})();
</script>
</body>
</html>
